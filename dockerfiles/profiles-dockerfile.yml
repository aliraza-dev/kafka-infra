FROM node:20-alpine AS builder

WORKDIR /app
COPY . .

RUN npm install --legacy-peer-deps
RUN npm run build profiles

FROM node:20-alpine
WORKDIR /app

COPY --from=builder /app/dist/apps/profiles ./dist
COPY package*.json .
RUN npm install --legacy-peer-deps --omit=dev

EXPOSE 3000

CMD ["node", "dist/main.js"]
